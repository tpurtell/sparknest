# Build the container image (packaging/docker) from a published release's
# tarballs and push it to GitHub's registry, for amd64 and arm64:
#   ghcr.io/<owner>/sparknest:<version> and :latest
# Runs when a release is published; run it by hand for an existing release.
name: container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v (e.g. 0.9.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v="${{ github.event.release.tag_name || inputs.version }}"
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sparknest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: packaging/docker
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REPO=${{ github.repository }}
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
