[workspace]
exclude = ["vendor"]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpurtell/sparknest"

[workspace.dependencies]
# internal
nest-types = { path = "crates/nest-types" }
nest-meta = { path = "crates/nest-meta" }
nest-raft = { path = "crates/nest-raft" }
nest-store = { path = "crates/nest-store" }
nest-fabric = { path = "crates/nest-fabric" }
nest-data = { path = "crates/nest-data" }
nest-fuse = { path = "crates/nest-fuse" }
nest-place = { path = "crates/nest-place" }
nest-api = { path = "crates/nest-api" }
nest-client = { path = "crates/nest-client" }
nest-testkit = { path = "crates/nest-testkit" }
nest-rpc = { path = "crates/nest-rpc" }

# external
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
openraft = { version = "=0.10.0-alpha.35", features = ["serde", "type-alias"] }
fuser = { version = "0.18", default-features = false }
io-uring = "0.7"
axum = { version = "0.8", features = ["json", "query", "tokio", "http1", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tonic = "0.14"
prost = "0.14"
bytes = "1"
parking_lot = "0.12"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "user", "mount", "uio"] }
rand = "0.9"
tempfile = "3"
proptest = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
postcard = { version = "1", features = ["use-std"] }
serde_bytes = "0.11"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4

# fuser with a FUSE-over-io_uring reply path (vendor/fuser/SPARKNEST.md).
[patch.crates-io]
fuser = { path = "vendor/fuser" }
